name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish a GitHub Release under this tag (for example v1.0.0),
          attaching the APKs. The tag is created from the selected branch if it
          does not exist yet. Leave empty to only build.
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: liquid_glass_widgets needs Flutter >= 3.41, and a moving `stable`
  # would make build failures impossible to reproduce from a commit hash.
  FLUTTER_VERSION: '3.47.3'

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # Needed only by the tag-triggered release step below.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Per-ABI APKs are roughly a third the size of the universal one; the
      # universal build stays for people who just want a file that installs
      # anywhere.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
      - name: Build universal APK
        run: flutter build apk --release

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk    dist/wave-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk  dist/wave-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk       dist/wave-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk              dist/wave-universal.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: wave-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Runs for a v* tag push, and for a manual run that names a tag. The
      # action creates the tag and the release when they do not exist yet,
      # which is what lets a release be cut without push access to tags.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Wave ${{ github.event.inputs.release_tag || github.ref_name }}
          generate_release_notes: true

  web:
    name: Web build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # The live music APIs send no CORS headers, so a browser cannot call them
      # from another origin. The hosted build therefore runs the bundled offline
      # catalogue — see lib/data/demo_source.dart.
      - name: Build web (demo catalogue)
        run: |
          flutter build web --release \
            --no-web-resources-cdn \
            --dart-define=WAVE_DEMO=true \
            --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: wave-web
          path: build/web
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

  pages:
    name: Deploy to GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
